name: Learning label
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [dev]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Validate metadata and label authorized submissions
        env:
          TOKEN: ${{ github.token }}
          VMETHOD_ROLE: orchestrator
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # vmethod reads GitHub credentials only from the gh login in GH_CONFIG_DIR.
        run: |
          export GH_CONFIG_DIR="$RUNNER_TEMP/gh"
          mkdir -p "$GH_CONFIG_DIR"
          printf 'github.com:\n    oauth_token: %s\n' "$TOKEN" > "$GH_CONFIG_DIR/hosts.yml"
          node dist/vmethod.mjs learnings check-pr "$PR_NUMBER" --label
