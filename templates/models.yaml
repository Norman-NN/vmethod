# Replace ids with installed models. Family names must match board options.
# Add API USD per million tokens for each family (including subscriptions):
# price: { input: <rate>, output: <rate>, cached: <rate> }
# Missing prices warn and leave cost unknown; do not enter zero as a placeholder.
- family: sol
  model: example/replace-me
  kind: opencode
  gate: none
  fallback: [glm, big-pickle]
  tier: standard
- family: astra
  model: example/owner-gated-model
  kind: opencode
  gate: owner
  tier: expensive
# Claude models run through OpenCode's claude-code provider like any other model.
- family: sonnet
  model: claude-code/replace-with-installed-model-id
  kind: opencode
  gate: none
  tier: standard
- family: glm
  model: example/replace-glm
  kind: opencode
  gate: none
  fallback: [big-pickle]
  tier: cheap
- family: big-pickle
  model: example/replace-big-pickle
  kind: opencode
  gate: none
  tier: cheap
