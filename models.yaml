# Worker model families for vmethod. Family names must match the board's Model options.
# Configure verified API USD/million rates as price: { input: n, output: n, cached: n }.
# Until rates are supplied, check warns and delivery costs remain unknown (not free).
- family: sol
  tier: standard
  model: codexbal/gpt-6.1-sol
  kind: opencode
  gate: none
  fallback: [luna, glm]
- family: luna
  tier: standard
  model: codexbal/gpt-6-luna
  kind: opencode
  gate: none
  fallback: [sol, glm]
- family: astra
  tier: expensive
  model: codexbal/gpt-6-astra
  kind: opencode
  gate: owner
  fallback: [sol]
- family: glm
  tier: standard
  model: ollama-cloud/glm-5.3
  kind: opencode
  gate: none
  fallback: [glm-flash, sol]
- family: glm-flash
  tier: standard
  model: ollama-cloud/glm-5.3-flash
  kind: opencode
  gate: none
  fallback: [glm, sol]
- family: big-pickle
  tier: standard
  model: opencode/big-pickle
  kind: opencode
  gate: none
  fallback: [sol]
